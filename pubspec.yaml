name: consvita
description: A mobile Flutter application for weather, tasks, and more.
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7+1
  google_fonts: ^8.0.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^21.0.0
  http: ^1.2.1
  connectivity_plus: ^7.1.1
  geolocator: ^14.0.0
  google_maps_flutter: ^2.6.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^1.0.0
  url_launcher: ^6.2.5
  flutter_native_splash: ^2.4.0
  animations: ^2.0.8
  flutter_spinkit: ^5.2.0
  flutter_riverpod: ^2.4.0
  table_calendar: ^3.1.3
  lottie: ^3.3.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  weather_icons: ^3.0.0 # https://pub.dev/packages/weather_icons
  timezone: ^0.11.0
  uuid: ^4.3.3
  sqflite: ^2.3.2


  # path_provider: ^2.1.1
  # provider: ^6.1.1
  # get_it: ^8.0.3
  # flutter_bloc: ^9.1.1
  # adaptive_theme: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/en.json
    - lib/l10n/pl.json

flutter_native_splash:
  color: "#0F0F0F"
  android: true
  ios: true